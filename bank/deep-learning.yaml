- id: dl-015
  category: deep-learning
  skills: [deep-learning, pytorch, gpu-hardware]
  difficulty: 3
  prompt: "What is gradient checkpointing and why does it let you train bigger models on the same GPU?"
  followups:
    - "What exactly is recomputed during the backward pass?"
    - "Roughly how much time does it cost and how much memory does it save?"
    - "How does it interact with mixed precision and activation offloading?"
  good_answer:
    - "Training stores activations for backward, activation memory scales with depth and batch"
    - "Checkpointing keeps only sparse activations and recomputes segments during backward"
    - "Saves most activation memory at roughly one extra forward pass cost"
    - "Enables larger batch, longer sequence, or deeper model on fixed VRAM"
    - "Recomputed segments can run in lower precision, memory savings compound"
    - "Offloading activations to CPU RAM is the slower-but-bigger sibling"
