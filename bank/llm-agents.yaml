    - "The model is trained to emit a structured call token sequence instead of prose"
    - "Runtime parses the call, executes it, and feeds the result back as a new message"
    - "The loop repeats until the model emits a final answer"
    - "Schema validation plus retry-with-error turns fixes malformed arguments"
    - "Fine-tuning on tool-use traces improves selection accuracy"
- id: llm-016
  category: llm-agents
  skills: [agents-rag, software-engineering]
  difficulty: 2
  prompt: "You are designing an agent that must complete multi-step tasks with tools. How do you make it reliable?"
  followups:
    - "How do you handle a tool failing mid-task?"
    - "When do you use a fixed workflow versus free-form planning?"
    - "How do you bound cost and runaway loops?"
  good_answer:
    - "Explicit state, step budgets, and timeouts prevent runaway loops"
    - "Prefer fixed workflows where the task is known, free-form planning only where needed"
    - "Give the model tool errors and partial results so it can recover"
    - "Validate tool outputs before they re-enter context"
    - "Checkpoint progress so a crash resumes instead of restarting"
    - "Log every step for replay-based debugging and regression tests"
- id: llm-017
  category: llm-agents
  skills: [agents-rag, software-engineering]
  difficulty: 2
  prompt: "What is prompt injection in an agent with tool access, and how would you defend against it?"
  followups:
    - "Why is an agent that reads web pages especially vulnerable?"
    - "Can guardrail prompts actually stop injection?"
    - "What capability-level controls limit the blast radius?"
  good_answer:
    - "Injected instructions arrive via retrieved content, tool output, or user data"
    - "The model cannot inherently separate instructions from data"
    - "Guardrail prompts reduce but do not eliminate risk"
    - "Least privilege tools, scoped credentials, and confirmation for destructive actions"
    - "Treat untrusted content as data, wrap and delimit it, strip instruction-like patterns"
    - "Log and audit actions, rate-limit, and sandbox execution"
