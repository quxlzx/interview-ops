    - "Hold out private eval sets to dodge contamination and overfitting to public sets"
    - "LLM-as-judge needs rubrics, pairwise comparisons, and spot-check calibration against humans"
    - "Run multiple seeds or samples, report variance, use paired comparisons"
    - "Track cost and latency alongside quality, not accuracy alone"
- id: llm-019
  category: llm-agents
  skills: [llm-serving, gpu-hardware]
  difficulty: 3
  prompt: "Explain speculative decoding. Why can a small draft model make a big model faster without changing its output distribution?"
  followups:
    - "What happens to drafted tokens that the big model rejects?"
    - "Why is this a win even though the big model runs more forward passes?"
    - "What limits the speedup?"
  good_answer:
    - "Draft model proposes k tokens, target model verifies all in one parallel pass"
    - "Verification uses the same teacher-forcing trick as training, cheap in FLOPs"
    - "Rejection sampling keeps the exact target distribution, accepted tokens match target sampling"
    - "Decoding is memory-bandwidth bound, one verification pass beats k sequential steps"
    - "Speedup bounded by draft acceptance rate and Amdahl on prefill"
    - "Draft-target agreement on easy text gives the biggest wins"
- id: llm-020
  category: llm-agents
  skills: [nlp, llm-serving]
  difficulty: 2
  prompt: "How does a BPE tokenizer work, and why do token limits, token costs, and multilingual performance all trace back to it?"
  followups:
    - "What happens to rare words and non-Latin scripts under a mostly-English vocabulary?"
    - "Why do tokenizers break string tasks like counting letters?"
    - "How does vocabulary size trade off against sequence length?"
  good_answer:
    - "BPE starts at characters and merges the most frequent pairs until vocab size is met"
    - "Frequent words become single tokens, rare ones split into subwords"
    - "Costs and context windows are counted in tokens, so compression ratio is money"
    - "Non-Latin scripts burn more tokens per word, raising cost and shrinking effective context"
    - "Subword splits destroy character-level structure, hurting spelling and counting tasks"
    - "Larger vocabularies shorten sequences but grow embedding matrices"
